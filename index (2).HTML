<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATP合成的动态示意图</title>
    <style>
        :root {
            --bg: #f5f9f2;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            color: var(--text);
        }
        .container {
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 14px 12px 12px;
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #2e5a2e;
            letter-spacing: 0.04em;
        }
        .canvas-wrap {
            background: #fafdf8;
            border-radius: 12px;
            border: 1px solid #dde5d5;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-pause {
            background: #4caf50;
            color: #fff;
        }
        .btn-pause:hover {
            background: #388e3c;
        }
        .btn-reset {
            background: #eceff1;
            color: #455a64;
        }
        .btn-reset:hover {
            background: #cfd8dc;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 0.75rem;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ATP合成的动态示意图</h1>
        </div>

        <div class="canvas-wrap">
            <canvas id="canvas" width="640" height="560" aria-label="ATP合成动态示意图"></canvas>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="legend-color" style="background:#ef5350;"></span> H⁺</div>
            <div class="legend-item"><span class="legend-color" style="background:#90a4ae;"></span> ADP</div>
            <div class="legend-item"><span class="legend-color" style="background:#ffcc80;"></span> Pi</div>
            <div class="legend-item"><span class="legend-color" style="background:#4db6ac;"></span> ATP</div>
            <div class="legend-item"><span class="legend-color" style="background:#9575cd;"></span> ATP合酶</div>
        </div>

        <div class="controls">
            <button class="btn btn-pause" id="btnPause">⏯️ 暂停</button>
            <button class="btn btn-reset" id="btnReset">↺ 重置</button>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            // ==================== 布局 ====================
            const membraneY = 260;
            const membraneH = 20;
            const stromaTop = 0;
            const stromaBottom = membraneY;
            const lumenTop = membraneY + membraneH;
            const lumenBottom = H;

            const cx = 320;
            const cRingY = membraneY + membraneH / 2;
            const cRingRadius = 38;
            const cSubunitCount = 12;
            const cSubunitRadius = 7;

            const aSubunitX = cx + cRingRadius + 16;
            const aSubunitW = 26;
            const aSubunitH = 58;
            const entryX = aSubunitX;
            const entryY = lumenTop + 6;

            const headY = membraneY - 92;
            const headRadius = 42;
            const petalCount = 6;
            const petalRadius = 17;

            const statorColor = '#607d8b';
            const statorStroke = '#37474f';

            // 酶核心区
            const enzymeZoneLeft = cx - 60;
            const enzymeZoneRight = cx + 60;
            const enzymeZoneBottom = membraneY - 40;

            // ==================== 状态 ====================
            let paused = false;
            let globalTime = 0;

            let cRingAngle = 0;
            let protonCounter = 0;
            let betaStates = [0, 1, 2];

            let protons = [];
            let atpMolecules = [];
            let adpFree = [];
            let piFree = [];
            let adpBound = null;
            let piBound = null;

            let atpSynthesized = 0;
            let protonsStoredInCring = 0;
            let protonEntryCooldown = 0;
            const protonEntryInterval = 0.9;

            const MAX_STROMA_PROTONS = 20;
            const MAX_ATP = 15;
            const INITIAL_LUMEN_PROTONS = 90;
            const MIN_NEAR_ENTRY = 8;

            function isInsideEnzymeZone(x, y) {
                return x > enzymeZoneLeft && x < enzymeZoneRight && y > stromaTop && y < enzymeZoneBottom;
            }

            function randomStromaPosition(avoidEnzyme = true) {
                let x, y, attempts = 0;
                do {
                    x = 30 + Math.random() * (W - 60);
                    y = stromaTop + 15 + Math.random() * (stromaBottom - stromaTop - 30);
                    attempts++;
                } while (avoidEnzyme && isInsideEnzymeZone(x, y) && attempts < 50);
                return { x, y };
            }

            // ==================== 粒子生成 ====================
            function spawnLumenProton() {
                const x = 25 + Math.random() * (W - 50);
                const y = lumenTop + 8 + Math.random() * (lumenBottom - lumenTop - 14);
                protons.push({
                    type: 'lumen',
                    x, y,
                    vx: (Math.random() - 0.5) * 0.65,
                    vy: (Math.random() - 0.5) * 0.65,
                    size: 5,
                    alpha: 1,
                    fading: false,
                });
            }

            function spawnStromaProton(x, y, vx, vy) {
                const p = {
                    type: 'stroma',
                    x, y,
                    vx: vx !== undefined ? vx : (Math.random() - 0.5) * 0.7,
                    vy: vy !== undefined ? vy : (Math.random() - 0.5) * 0.7,
                    size: 5,
                    alpha: 1,
                    fading: false,
                };
                protons.push(p);
                return p;
            }

            function spawnADP() {
                adpFree.push({
                    x: 25 + Math.random() * 80,
                    y: stromaTop + 10 + Math.random() * 45,
                    targetX: cx - 16,
                    targetY: headY - 10,
                    state: 'free',
                    progress: 0,
                    speed: 0.025 + Math.random() * 0.018,
                });
            }

            function spawnPi() {
                piFree.push({
                    x: W - 25 - Math.random() * 80,
                    y: stromaTop + 10 + Math.random() * 45,
                    targetX: cx + 14,
                    targetY: headY - 6,
                    state: 'free',
                    progress: 0,
                    speed: 0.025 + Math.random() * 0.018,
                });
            }

            function releaseATP() {
                const atpX = cx + (Math.random() - 0.5) * 16;
                const atpY = headY - headRadius - 6;
                const mol = {
                    x: atpX,
                    y: atpY,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -Math.random() * 3.5 - 2,
                    alpha: 1,
                    fading: false,
                };
                atpMolecules.push(mol);
                atpSynthesized++;
                while (atpMolecules.length > MAX_ATP) {
                    const oldest = atpMolecules[0];
                    if (!oldest.fading) oldest.fading = true;
                    else atpMolecules.shift();
                }
            }

            function releaseProtonBatchToStroma(count) {
                const baseX = aSubunitX;
                const baseY = membraneY - 6;
                for (let j = 0; j < count; j++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.7;
                    const speed = 1.0 + Math.random() * 1.4;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const sx = baseX + (Math.random() - 0.5) * 26;
                    const sy = baseY - Math.random() * 12;
                    spawnStromaProton(sx, sy, vx, vy);
                }
                const stromaList = protons.filter(p => p.type === 'stroma');
                while (stromaList.length > MAX_STROMA_PROTONS) {
                    const oldest = stromaList[0];
                    if (!oldest.fading) oldest.fading = true;
                    else {
                        const idx = protons.indexOf(oldest);
                        if (idx >= 0) protons.splice(idx, 1);
                    }
                    stromaList.shift();
                }
            }

            // ==================== 更新 ====================
            function updateProtons(dt) {
                for (let i = protons.length - 1; i >= 0; i--) {
                    const p = protons[i];
                    if (p.fading) {
                        p.alpha -= dt * 0.8;
                        if (p.alpha <= 0.01) {
                            protons.splice(i, 1);
                            continue;
                        }
                    }

                    if (p.type === 'lumen') {
                        // 全部腔内质子只做自由布朗运动
                        p.vx += (Math.random() - 0.5) * 0.8 * dt;
                        p.vy += (Math.random() - 0.5) * 0.8 * dt;
                        const maxSpeed = 2.2;
                        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                        if (spd > maxSpeed) {
                            p.vx *= maxSpeed / spd;
                            p.vy *= maxSpeed / spd;
                        }
                        p.x += p.vx * dt * 38;
                        p.y += p.vy * dt * 38;
                        if (p.x < 4 || p.x > W - 4) p.vx *= -1;
                        if (p.y < lumenTop + 3 || p.y > lumenBottom - 3) p.vy *= -1;
                    } else if (p.type === 'stroma') {
                        p.vx += (Math.random() - 0.5) * 1.0 * dt;
                        p.vy += (Math.random() - 0.5) * 1.0 * dt;
                        const maxSpeed = 1.8;
                        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                        if (spd > maxSpeed) {
                            p.vx *= maxSpeed / spd;
                            p.vy *= maxSpeed / spd;
                        }
                        p.x += p.vx * dt * 32;
                        p.y += p.vy * dt * 32;
                        if (p.x < 6 || p.x > W - 6) p.vx *= -1;
                        if (p.y < stromaTop + 4 || p.y > stromaBottom - 4) p.vy *= -1;
                        p.vx *= 0.998;
                        p.vy *= 0.998;
                    } else if (p.type === 'entering') {
                        p.progress += dt * 3.5;
                        if (p.progress >= 1) {
                            p.progress = 0;
                            p.type = 'inChannel';
                            p.x = entryX;
                            p.y = cRingY - 4;
                        } else {
                            p.x += (p.targetX - p.x) * 0.4 * dt * 60;
                            p.y += (p.targetY - p.y) * 0.4 * dt * 60;
                        }
                    } else if (p.type === 'inChannel') {
                        p.progress += dt * 2.8;
                        if (p.progress >= 1) {
                            protonCounter++;
                            protonsStoredInCring++;
                            protons.splice(i, 1);
                            if (protonCounter >= 3) {
                                protonCounter = 0;
                                const toRelease = protonsStoredInCring;
                                protonsStoredInCring = 0;
                                releaseProtonBatchToStroma(toRelease);
                                cRingAngle += (2 * Math.PI) / 3;
                                const prevT = betaStates[0];
                                betaStates.unshift(betaStates.pop());
                                if (prevT === 2) releaseATP();
                                if (betaStates[0] === 0 && adpBound === null && piBound === null) {
                                    if (adpFree.length > 0 && piFree.length > 0) {
                                        const adp = adpFree.shift();
                                        const pi = piFree.shift();
                                        adp.state = 'bound';
                                        adp.x = cx - 12;
                                        adp.y = headY - 6;
                                        pi.state = 'bound';
                                        pi.x = cx + 10;
                                        pi.y = headY - 6;
                                        adpBound = adp;
                                        piBound = pi;
                                    }
                                }
                                if (betaStates[0] === 2 && adpBound && piBound) {
                                    adpBound = null;
                                    piBound = null;
                                }
                            }
                            continue;
                        }
                    }
                }

                // 入口附近质子不足时温和补充
                const nearProtons = protons.filter(p => p.type === 'lumen' && Math.hypot(p.x - entryX, p.y - entryY) < 60);
                if (nearProtons.length < MIN_NEAR_ENTRY) {
                    const farProtons = protons
                        .filter(p => p.type === 'lumen' && Math.hypot(p.x - entryX, p.y - entryY) >= 60)
                        .sort((a, b) => Math.hypot(a.x - entryX, a.y - entryY) - Math.hypot(b.x - entryX, b.y - entryY));
                    if (farProtons.length > 0) {
                        const fp = farProtons[0];
                        const dx = entryX - fp.x;
                        const dy = entryY - fp.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        fp.vx += (dx / dist) * 1.0 * dt;
                        fp.vy += (dy / dist) * 1.0 * dt;
                    }
                }
            }

            function updateFreeMolecules(dt) {
                for (let i = adpFree.length - 1; i >= 0; i--) {
                    const m = adpFree[i];
                    if (m.state === 'free') {
                        m.x += (m.targetX - m.x) * 0.08 * dt * 60;
                        m.y += (m.targetY - m.y) * 0.08 * dt * 60;
                        if (adpFree.length > 3) adpFree.splice(i, 1);
                    }
                }
                for (let i = piFree.length - 1; i >= 0; i--) {
                    const m = piFree[i];
                    if (m.state === 'free') {
                        m.x += (m.targetX - m.x) * 0.08 * dt * 60;
                        m.y += (m.targetY - m.y) * 0.08 * dt * 60;
                        if (piFree.length > 3) piFree.splice(i, 1);
                    }
                }
            }

            function updateATP(dt) {
                for (let i = atpMolecules.length - 1; i >= 0; i--) {
                    const m = atpMolecules[i];
                    if (m.fading) {
                        m.alpha -= dt * 0.6;
                        if (m.alpha <= 0.01) {
                            atpMolecules.splice(i, 1);
                            continue;
                        }
                    }
                    m.x += m.vx * dt * 32;
                    m.y += m.vy * dt * 32;
                    m.vx *= 0.998;
                    m.vy *= 0.998;
                    if (m.x < 12 || m.x > W - 12) m.vx *= -1;
                    if (m.y < stromaTop + 5) m.vy *= -1;
                    if (m.y > stromaBottom - 5) m.vy *= -1;
                }
            }

            // ==================== 绘制 ====================
            function drawBackground() {
                ctx.fillStyle = '#fdfbf7';
                ctx.fillRect(0, stromaTop, W, stromaBottom - stromaTop);
                const lumenGrad = ctx.createLinearGradient(0, lumenTop, 0, lumenBottom);
                lumenGrad.addColorStop(0, '#d0e6bc');
                lumenGrad.addColorStop(1, '#b0cca0');
                ctx.fillStyle = lumenGrad;
                ctx.fillRect(0, lumenTop, W, lumenBottom - lumenTop);
                const memGrad = ctx.createLinearGradient(0, membraneY, 0, membraneY + membraneH);
                memGrad.addColorStop(0, '#8ab868');
                memGrad.addColorStop(0.5, '#a8d088');
                memGrad.addColorStop(1, '#7ca858');
                ctx.fillStyle = memGrad;
                ctx.fillRect(0, membraneY, W, membraneH);
                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                for (let x = 8; x < W; x += 22) {
                    ctx.beginPath();
                    ctx.arc(x, membraneY + 6, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 11, membraneY + membraneH - 6, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = '#4a6d32';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(0, membraneY);
                ctx.lineTo(W, membraneY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, membraneY + membraneH);
                ctx.lineTo(W, membraneY + membraneH);
                ctx.stroke();
                ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei"';
                ctx.textAlign = 'right';
                ctx.fillStyle = '#5a7d4a';
                ctx.fillText('叶绿体基质', W - 14, 20);
                ctx.fillStyle = '#3a5d2a';
                ctx.fillText('类囊体腔', W - 14, H - 10);
                ctx.textAlign = 'start';
            }

            function drawProtonsAll() {
                for (const p of protons) {
                    if (p.type === 'entering' || p.type === 'inChannel') {
                        const py = p.type === 'inChannel' ? cRingY - 4 - p.progress * 6 : p.y + (p.targetY - p.y) * Math.min(p.progress, 1);
                        ctx.save();
                        ctx.globalAlpha = p.alpha || 1;
                        const grad = ctx.createRadialGradient(p.x, py, 0, p.x, py, 7);
                        grad.addColorStop(0, 'rgba(255,80,80,0.95)');
                        grad.addColorStop(1, 'rgba(220,40,40,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(p.x, py, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#e53935';
                        ctx.strokeStyle = '#b71c1c';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.arc(p.x, py, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 7px "PingFang SC","Microsoft YaHei"';
                        ctx.textAlign = 'center';
                        ctx.fillText('H⁺', p.x, py + 2.5);
                        ctx.restore();
                        continue;
                    }
                    ctx.save();
                    ctx.globalAlpha = p.alpha || 1;
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 8);
                    if (p.type === 'lumen') {
                        grad.addColorStop(0, 'rgba(239,83,80,0.95)');
                    } else {
                        grad.addColorStop(0, 'rgba(255,138,128,0.85)');
                    }
                    grad.addColorStop(1, 'rgba(255,80,80,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = p.type === 'lumen' ? '#e53935' : '#ff8a80';
                    ctx.strokeStyle = '#b71c1c';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 7px "PingFang SC","Microsoft YaHei"';
                    ctx.textAlign = 'center';
                    ctx.fillText('H⁺', p.x, p.y + 2.5);
                    ctx.restore();
                }
            }

            function drawSynthase() {
                // 定子a亚基
                ctx.save();
                ctx.fillStyle = statorColor;
                ctx.strokeStyle = statorStroke;
                ctx.lineWidth = 3;
                const ax = aSubunitX - aSubunitW / 2;
                const ay = membraneY - 6;
                ctx.beginPath();
                ctx.roundRect(ax, ay, aSubunitW, aSubunitH, 7);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#1a2733';
                ctx.beginPath();
                ctx.arc(ax + 6, ay + 12, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ax + 6, ay + aSubunitH - 12, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 定子臂
                ctx.save();
                ctx.strokeStyle = statorColor;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(ax + aSubunitW / 2, ay);
                ctx.lineTo(cx + 8, headY - headRadius - 8);
                ctx.stroke();
                ctx.fillStyle = statorColor;
                ctx.strokeStyle = statorStroke;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx + 8, headY - headRadius - 5, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // c环
                ctx.save();
                ctx.translate(cx, cRingY);
                ctx.rotate(cRingAngle);
                for (let i = 0; i < cSubunitCount; i++) {
                    const angle = (i / cSubunitCount) * Math.PI * 2;
                    const sx = Math.cos(angle) * cRingRadius;
                    const sy = Math.sin(angle) * cRingRadius;
                    ctx.fillStyle = '#9575cd';
                    ctx.strokeStyle = '#4a2d8a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(sx, sy, cSubunitRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.fillStyle = '#6a45b8';
                ctx.beginPath();
                ctx.arc(0, 0, cRingRadius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // γ轴
                ctx.save();
                ctx.strokeStyle = '#ff8c00';
                ctx.lineWidth = 5.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx, cRingY);
                ctx.lineTo(cx, headY);
                ctx.stroke();
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.arc(cx, headY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // CF₁头部
                ctx.save();
                ctx.translate(cx, headY);
                for (let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * Math.PI * 2;
                    const px = Math.cos(angle) * headRadius * 0.58;
                    const py = Math.sin(angle) * headRadius * 0.58;
                    if (i % 2 === 0) {
                        ctx.fillStyle = '#b39ddb';
                        ctx.strokeStyle = '#5a3f8a';
                    } else {
                        const betaIdx = Math.floor(i / 2);
                        const state = betaStates[betaIdx];
                        if (state === 2) ctx.fillStyle = '#81c784';
                        else if (state === 1) ctx.fillStyle = '#fff176';
                        else ctx.fillStyle = '#d5d5d5';
                        ctx.strokeStyle = '#444';
                    }
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(px, py, petalRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.fillStyle = '#ff8c00';
                ctx.strokeStyle = '#cc6600';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function drawMolecule(x, y, type, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                if (type === 'ADP') {
                    ctx.fillStyle = '#90a4ae';
                    ctx.strokeStyle = '#263238';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x - 12, y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px "PingFang SC","Microsoft YaHei"';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', x - 12, y + 3);
                    for (let i = 0; i < 2; i++) {
                        const px = x + i * 11;
                        ctx.fillStyle = '#b0bec5';
                        ctx.strokeStyle = '#37474f';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(px, y, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#263238';
                        ctx.font = 'bold 7px "PingFang SC","Microsoft YaHei"';
                        ctx.fillText('P', px, y + 2.5);
                    }
                    ctx.strokeStyle = '#263238';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.moveTo(x - 2, y);
                    ctx.lineTo(x + 5, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + 8, y);
                    ctx.lineTo(x + 11, y);
                    ctx.stroke();
                } else if (type === 'Pi') {
                    ctx.fillStyle = '#ffb74d';
                    ctx.strokeStyle = '#bf360c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#4e1a00';
                    ctx.font = 'bold 8px "PingFang SC","Microsoft YaHei"';
                    ctx.textAlign = 'center';
                    ctx.fillText('Pi', x, y + 3);
                } else if (type === 'ATP') {
                    ctx.fillStyle = '#4db6ac';
                    ctx.strokeStyle = '#004d40';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x - 15, y, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px "PingFang SC","Microsoft YaHei"';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', x - 15, y + 3);
                    for (let i = 0; i < 3; i++) {
                        const px = x + i * 12;
                        ctx.fillStyle = '#ffb74d';
                        ctx.strokeStyle = '#bf360c';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(px, y, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = '#4e1a00';
                        ctx.font = 'bold 7px "PingFang SC","Microsoft YaHei"';
                        ctx.fillText('P', px, y + 2.5);
                    }
                    ctx.strokeStyle = '#004d40';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x - 4, y);
                    ctx.lineTo(x + 4, y);
                    ctx.stroke();
                    for (let i = 0; i < 2; i++) {
                        ctx.beginPath();
                        ctx.moveTo(x + i * 12 + 6, y);
                        ctx.lineTo(x + (i + 1) * 12 - 4, y);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#d32f2f';
                    ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei"';
                    ctx.fillText('~', x + 4, y - 11);
                    ctx.fillText('~', x + 16, y - 11);
                }
                ctx.restore();
            }

            function drawAll() {
                ctx.clearRect(0, 0, W, H);
                drawBackground();
                drawProtonsAll();
                drawSynthase();
                for (const m of adpFree) { if (m.state === 'free') drawMolecule(m.x, m.y, 'ADP'); }
                for (const m of piFree) { if (m.state === 'free') drawMolecule(m.x, m.y, 'Pi'); }
                if (adpBound) drawMolecule(adpBound.x, adpBound.y, 'ADP');
                if (piBound) drawMolecule(piBound.x, piBound.y, 'Pi');
                for (const m of atpMolecules) drawMolecule(m.x, m.y, 'ATP', m.alpha);
            }

            // ==================== 动画循环 ====================
            let lastTime = performance.now();
            let spawnTimer = 0;

            function animate(now) {
                if (!paused) {
                    let dt = (now - lastTime) / 1000;
                    if (dt > 0.15) dt = 0.15;
                    lastTime = now;
                    globalTime += dt;

                    updateProtons(dt);
                    updateFreeMolecules(dt);
                    updateATP(dt);

                    spawnTimer += dt;
                    if (spawnTimer > 0.45) {
                        spawnTimer = 0;
                        const lumenCount = protons.filter(p => p.type === 'lumen').length;
                        if (lumenCount < INITIAL_LUMEN_PROTONS) spawnLumenProton();
                    }

                    protonEntryCooldown += dt;
                    if (protonEntryCooldown >= protonEntryInterval) {
                        protonEntryCooldown = 0;
                        const candidates = protons.filter(p => p.type === 'lumen' &&
                            Math.abs(p.x - entryX) < 55 && p.y < lumenTop + 40);
                        if (candidates.length > 0) {
                            const p = candidates[0];
                            p.type = 'entering';
                            p.progress = 0;
                            p.targetX = entryX;
                            p.targetY = cRingY - 4;
                        }
                    }

                    if (adpFree.length < 2 && Math.random() < 0.04) spawnADP();
                    if (piFree.length < 2 && Math.random() < 0.04) spawnPi();

                    drawAll();
                }
                requestAnimationFrame(animate);
            }

            document.getElementById('btnPause').addEventListener('click', () => {
                paused = !paused;
                if (!paused) lastTime = performance.now();
            });
            document.getElementById('btnReset').addEventListener('click', () => {
                protons = [];
                atpMolecules = [];
                adpFree = [];
                piFree = [];
                adpBound = null;
                piBound = null;
                cRingAngle = 0;
                protonCounter = 0;
                protonsStoredInCring = 0;
                protonEntryCooldown = 0;
                betaStates = [0, 1, 2];
                atpSynthesized = 0;
                globalTime = 0;
                for (let i = 0; i < INITIAL_LUMEN_PROTONS; i++) spawnLumenProton();
                for (let i = 0; i < 10; i++) {
                    const pos = randomStromaPosition(true);
                    spawnStromaProton(pos.x, pos.y);
                }
                for (let i = 0; i < 2; i++) { spawnADP(); spawnPi(); }
                drawAll();
            });

            for (let i = 0; i < INITIAL_LUMEN_PROTONS; i++) spawnLumenProton();
            for (let i = 0; i < 10; i++) {
                const pos = randomStromaPosition(true);
                spawnStromaProton(pos.x, pos.y);
            }
            for (let i = 0; i < 2; i++) { spawnADP(); spawnPi(); }
            drawAll();
            requestAnimationFrame(animate);

            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    this.beginPath();
                    this.moveTo(x + r.tl, y);
                    this.lineTo(x + w - r.tr, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    this.lineTo(x + w, y + h - r.br);
                    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    this.lineTo(x + r.bl, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    this.lineTo(x, y + r.tl);
                    this.quadraticCurveTo(x, y, x + r.tl, y);
                    this.closePath();
                };
            }
        })();
    </script>
